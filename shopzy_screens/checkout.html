<body class="bg-background text-on-background min-h-screen selection:bg-primary selection:text-on-primary">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 bg-transparent flex justify-between items-center px-container-margin py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary scale-110">arrow_back</span>
<span class="font-display-lg text-headline-lg-mobile bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Shopzy</span>
</div>
<div class="flex items-center gap-4">

</div>
</header>
<main class="pt-24 pb-32 px-container-margin max-w-2xl mx-auto space-y-stack-lg">

<section class="flex justify-between items-center relative px-4">
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-surface-container-highest -z-10 -translate-y-1/2"></div>

<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-sm shadow-[0_0_15px_rgba(221,183,255,0.4)]">1</div>
<span class="font-label-sm text-label-sm text-primary">Shipping</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant text-on-surface flex items-center justify-center font-bold text-sm">2</div>
<span class="font-label-sm text-label-sm text-on-surface opacity-40">Payment</span>
</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant text-on-surface flex items-center justify-center font-bold text-sm">3</div>
<span class="font-label-sm text-label-sm text-on-surface opacity-40">Review</span>
</div>
</section>

<div class="flex items-center gap-4">

<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile">Shipping Details</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Where should we send your order?</p>
</div>
</div>
</button>
<div class="px-6 pb-8 space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-sm text-label-sm ml-2">First Name</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface placeholder:opacity-30" placeholder="Alex" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-sm text-label-sm ml-2">Last Name</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface placeholder:opacity-30" placeholder="Rivers" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-sm text-label-sm ml-2">Address</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface placeholder:opacity-30" placeholder="123 Neon Boulevard" type="text"/>
</div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<div class="col-span-1 space-y-2">
<label class="font-label-sm text-label-sm ml-2">City</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface placeholder:opacity-30" placeholder="Night City" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-sm text-label-sm ml-2">Zip Code</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface placeholder:opacity-30" placeholder="90210" type="text"/>
</div>
<div class="hidden md:block space-y-2">
<label class="font-label-sm text-label-sm ml-2">Country</label>
<select class="w-full bg-surface-container-high border-none rounded-lg p-4 focus:ring-1 focus:ring-primary text-on-surface appearance-none">
<option>United States</option>
<option>United Kingdom</option>
<option>Japan</option>
</select>
</div>
</div>
<button class="w-full gradient-bg py-5 rounded-full font-headline-lg-mobile text-white shadow-xl transform active:scale-95 transition-transform duration-200">
                        Continue to Payment
                    </button>
</div>
</section>
<!-- Section 2: Payment (Collapsed State) -->
<section class="glass rounded-lg opacity-60 grayscale-[0.5] hover:opacity-100 hover:grayscale-0 transition-all duration-300">

<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface">payments</span>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile">Payment Method</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Secure encrypted transactions</p>
</div>
</div>
<span class="material-symbols-outlined">expand_more</span>
</button>
</section>
<!-- Section 3: Order Review (Collapsed State) -->
<section class="glass rounded-lg opacity-60 grayscale-[0.5] hover:opacity-100 hover:grayscale-0 transition-all duration-300">

<span class="material-symbols-outlined text-on-surface">shopping_basket</span>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile">Review Order</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Check items and totals</p>
</div>
</div>
<span class="material-symbols-outlined">expand_more</span>
</button>
</section>
</div>

<div class="flex gap-4">
<div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A high-end professional studio photograph of a vibrant neon crimson running shoe captured against a deep obsidian background. The lighting is dramatic, highlighting the sleek textures and futuristic aerodynamic silhouette of the footwear. Thin trails of magenta light swirl around the shoe, emphasizing a sense of high-speed motion and premium technology. The overall aesthetic is sleek, expensive, and modern." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBn7PR1HLUwb-tgCZImfZD4fVY1TokWLpZn8y5vxnJnPBIsnanE5yDUJaOzOthwY5XKB6WfFfHIt8YPy1Ab_H0oK6emdNzULFHDoLrcD7nCA4z-5ko6Ik1KSOWLi5kZqhd_Y-hWmCiB_ZgfgsJ-M-EVepaZ3HiKUcxdPUxKo0iymczlbLj9PoLzej7wbMhhwaIHPQKrzKN9E2ejv1UYTQsov74yjq6i0Ynbz1G24c0m5JarkvVZCqhQSZhxFpmTlRJOY4zo-YAJhBg"/>
</div>
<div class="flex-grow">
<div class="flex justify-between">
<p class="font-body-md text-body-md font-semibold">AeroMax Elite V2</p>
<p class="font-body-md text-body-md font-bold">$189.00</p>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Size: 10 | Color: Volt Red</p>
<p class="font-label-sm text-label-sm text-primary">In Stock - Ready to ship</p>
</div>
</div>
<div class="border-t border-white/10 pt-4 space-y-2">
<div class="flex justify-between text-on-surface-variant font-label-sm text-label-sm">
<span>Subtotal</span>
<span>$189.00</span>
</div>
<div class="flex justify-between text-on-surface-variant font-label-sm text-label-sm">
<span>Shipping</span>
<span class="text-tertiary">FREE</span>
</div>
<div class="flex justify-between font-headline-lg-mobile text-headline-lg-mobile text-on-surface pt-2">
<span>Total</span>
<span>$189.00</span>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Shell (Filter Applied: Only for top-level, hidden on checkout) -->
<!-- Suppression logic: Checkout is a transactional flow. Global nav is hidden. -->

<footer class="fixed bottom-0 w-full p-6 glass border-none z-50 md:hidden">
<div class="flex items-center justify-between gap-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm opacity-60">Grand Total</span>
<span class="font-headline-lg text-primary">$189.00</span>
</div>
<button class="flex-grow gradient-bg py-4 rounded-full font-headline-lg-mobile text-white text-center shadow-lg transform active:scale-95 transition-all">
                Final Step

</div>
