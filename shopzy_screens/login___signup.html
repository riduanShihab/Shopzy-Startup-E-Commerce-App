<style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-hidden">
<!-- Auth Shell Suppression: TopAppBar and BottomNavBar are hidden per JSON logic for transactional screens -->
<main class="flex-grow flex items-center justify-center p-container-margin relative overflow-hidden">
<!-- Abstract Background Elements -->
<div class="absolute top-[-10%] right-[-10%] w-[60%] h-[60%] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Anchor -->
<div class="flex flex-col items-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-stack-sm">Shopzy</h1>
<p class="text-on-surface-variant text-center px-8">Elevate your digital lifestyle with the next generation of curated essentials.</p>
</div>
<!-- Login/Signup Card -->
<div class="glass p-8 rounded-xl space-y-stack-md">
<div class="space-y-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface/60 px-2">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 text-on-surface placeholder:text-on-surface/30 focus:ring-1 focus:ring-primary transition-all" placeholder="hello@shopzy.com" type="email"/>
</div>
<div class="space-y-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface/60 px-2">PASSWORD</label>
<input class="w-full bg-surface-container-high border-none rounded-lg p-4 text-on-surface placeholder:text-on-surface/30 focus:ring-1 focus:ring-primary transition-all" placeholder="••••••••" type="password"/>
</div>
<!-- Primary CTA -->
<button class="w-full py-4 rounded-full bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-bold text-lg active:scale-95 transition-transform duration-200 mt-4">
                    Join the Club
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-4">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="text-label-sm font-label-sm text-on-surface/40">OR CONTINUE WITH</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-gutter">
<button class="flex items-center justify-center gap-2 py-3 bg-surface-container-high rounded-full border border-white/5 active:scale-95 transition-transform hover:bg-surface-variant">
<span class="material-symbols-outlined text-[20px]">apps</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Apple</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 bg-surface-container-high rounded-full border border-white/5 active:scale-95 transition-transform hover:bg-surface-variant">
<!-- Custom Icon logic for Socials -->
<span class="material-symbols-outlined text-[20px]">google</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Google</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center space-y-4">
<p class="text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Create one now</a>
</p>
<div class="flex justify-center gap-6">
<a class="text-label-sm font-label-sm text-on-surface/40 hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="text-label-sm font-label-sm text-on-surface/40 hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
</main>
<!-- Decorative Image Feed Background (Simulating "Hype" Generation) -->

<div class="grid grid-cols-3 gap-4 p-4 transform -rotate-12 scale-125">

</div>
<div class="aspect-[9/16] rounded-lg overflow-hidden">
<img class="w-full h-full object-cover" data-alt="An artistic flat-lay of modern lifestyle accessories including a minimalist watch and sleek earbuds on a textured dark background. Soft glow from a nearby neon source casts ethereal purple and pink shadows across the arrangement. The visual style is crisp and clean, embodying frictionless high-fashion aesthetics for a mobile generation." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7ywQrScr51Y87VqfvUkx7QcYPaxt368nXc-pD6ths1jqMXaqrBFuHnd-xhh-miYhFIRRiwLLttwxu2KnwL_fJIzR02-51Vyi6pB1J5ctDiZ7ovu1iBHsnLxawfVT0NH342TZsjI-2CJ_zMhzfzrlBs4VqWLR873qj8grFwLAohNffYHF_u3m48YdUcjyvIOslpo1NjQqO76JZv1CEESwLQ8fXgbm9rRIWajdslAl_7qPM0O-wNx-e8y-Mnji21AAx298eGfFrk0M"/>
</div>
</div>
</div>
